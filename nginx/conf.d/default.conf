# Основной сервер на HTTPS
server {
#   use 443 to serve over HTTPS on the Internet or 80 to serve over HTTP on localhost
#    listen 443 ssl;
    listen 80;
    http2 on;
    # TODO: use your domain name here
    server_name localhost; #avo.rudych.ru; # 

    # SSL сертификаты
    # TODO: place your certificate files under these paths
    # https://en.wikipedia.org/wiki/HTTPS
    # https://letsencrypt.org/
    # uncomment for HTTPS
#    ssl_certificate /etc/nginx/ssl/fullchain.pem;
#    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    
    # SSL настройки
#    ssl_protocols TLSv1.2 TLSv1.3;
#    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
#    ssl_prefer_server_ciphers on;
    
    root /usr/share/nginx/html;
    index index.html;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ================= Public Services =================
    
    # example.com/datamgmt/
    location /datamgmt/ {
        proxy_pass http://datamgmt/;  # слэш в конце, чтобы префикс удалялся автоматически при отправке url в upstream сервис!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Для WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # example.com/games/
    location /games/ {
        proxy_pass http://games/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebRTC требует WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # WebRTC может требовать долгого соединения
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # example.com/inference/
    location /inference/ {
        proxy_pass http://inference; # тут слэш не нужен, т.к. upstream сервис ожидает полный путь
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
	#	proxy_set_header X-Forwarded-Prefix $uri;
        
        # Для больших запросов
        client_max_body_size 100M;
    }

    location /nextcloud/ {
        proxy_pass http://nextcloud/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Nextcloud специфичные настройки
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
	proxy_set_header X-ScriptName /nextcloud/index.php;
        
        # Для WebDAV и больших файлов
        client_max_body_size 10G;
        proxy_request_buffering off;

    	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header Referrer-Policy "no-referrer-when-downgrade" always;	

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location /couchdb/ {
        # Pass to upstream
        proxy_pass http://couchdb/;
        
        # Essential Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout for long-polling (changes feed)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        
        # Buffering off for streaming
        proxy_buffering off;
        proxy_cache off;
    }

    # ================= Default: 404 =================
    location / {
	try_files /index.html =404;
	#        return 404 "Service not found\n";
	#        add_header Content-Type text/plain;
    }
}
