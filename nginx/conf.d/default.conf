# Upstream definitions: для внутренних сервисов

# сервисы API-обвязки
# сервис записи и разметки аудио
upstream datamgmt {
    server datamgmt:3000;
}
# сервис для удаленного обращения к инференсу
upstream inference {
    server inference:8001;  # порт FastAPI
}

# сервис с демонстрацией приложений для записи аудио, диагностики
upstream games {
    server games:8000;  # порт, на котором слушает aiohttp app
}

# базовые сервисы хранения для данных и метаданных, используются сервисом и утилитами datamgmt
upstream nextcloud {
    server nextcloud:80;
}
upstream couchdb {
    server couchdb:5984;
}

